<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guillermo Gómez Rivas · Arquitecto Cloud</title>
<meta name="description" content="Portfolio de Guillermo Gómez Rivas, arquitecto cloud junior: experiencia en OCI, GCP y Terraform, proyectos y formación, dibujados como un plano de arquitectura.">
<meta name="author" content="Guillermo Gómez Rivas">
<meta property="og:type" content="website">
<meta property="og:title" content="Guillermo Gómez Rivas · Arquitecto Cloud">
<meta property="og:description" content="Mi currículum, dibujado como un plano de arquitectura cloud. Haz clic en cualquier recurso para ver el detalle.">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0D2B4C">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/big-shoulders-stencil-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
<script>
  /* Tema antes de pintar, para no parpadear */
  try { var t = localStorage.getItem("ggr-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<!--APP-START-->
<a class="skip" href="#lectura" data-mode-link="lectura">Saltar a la versión en texto</a>

<header class="bar" id="bar">
  <div class="bar__id">
    <span class="bar__code">GGR · ARQ-CLOUD</span>
    <span class="bar__sheet">Lámina 01 · <span id="bar-rev">rev. v1.0</span></span>
  </div>
  <nav class="bar__nav" aria-label="Controles de la página">
    <div class="seg" role="group" aria-label="Vista">
      <button type="button" class="seg__btn" data-mode="plano" aria-pressed="true">Plano</button>
      <button type="button" class="seg__btn" data-mode="lectura" aria-pressed="false">Lectura</button>
    </div>
    <button type="button" class="icon-btn" id="btn-console" aria-label="Abrir la consola" title="Consola (tecla º o `)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l6 6-6 6M12 18h8"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-theme" aria-label="Cambiar entre papel y cianotipia" title="Papel / cianotipia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
    </button>
  </nav>
</header>

<main id="sheet" class="sheet">
  <section class="hero" id="hero" aria-label="Presentación"></section>

  <section class="drawing" id="plano" aria-labelledby="plano-title">
    <div class="drawing__head">
      <div>
        <p class="eyebrow">Planta 01 · escala 1:1</p>
        <h2 class="drawing__title" id="plano-title">Arquitectura profesional</h2>
        <p class="drawing__hint">Cada recurso del plano es una parte de mi currículum. Pulsa sobre él para ver el detalle, o recórrelo en orden.</p>
      </div>
      <button type="button" class="btn btn--ink" id="btn-tour">
        Recorrer el plano
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="drawing__body">
      <div class="diagram-wrap">
        <div class="diagram" id="diagram">
          <svg class="wires" id="wires" aria-hidden="true"></svg>
        </div>
      </div>
      <aside class="notes" id="notes" aria-label="Notas del plano"></aside>
    </div>
  </section>

  <article class="read" id="lectura" hidden aria-label="Currículum en texto"></article>

  <footer class="cartouche" id="cartouche"></footer>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="inspector" id="inspector" role="dialog" aria-modal="true" aria-labelledby="insp-title" hidden>
  <div class="inspector__bar">
    <code class="inspector__addr" id="insp-addr"></code>
    <button type="button" class="icon-btn" id="insp-close" aria-label="Cerrar ficha">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="inspector__scroll" id="insp-body"></div>
  <div class="inspector__nav">
    <button type="button" class="btn btn--ghost" id="insp-prev"></button>
    <span class="inspector__count" id="insp-count"></span>
    <button type="button" class="btn btn--ghost" id="insp-next"></button>
  </div>
</aside>

<section class="console" id="console" hidden aria-label="Consola">
  <div class="console__bar">
    <span>guillermo@es-madrid-1 — consola</span>
    <button type="button" class="console__x" id="console-close" aria-label="Cerrar la consola">×</button>
  </div>
  <div class="console__out" id="console-out" role="log" aria-live="polite"></div>
  <form class="console__in" id="console-form" autocomplete="off">
    <label for="console-input" class="console__prompt">~$</label>
    <input id="console-input" type="text" spellcheck="false" autocapitalize="off" aria-label="Escribe un comando">
  </form>
</section>

<div class="applylog" id="applylog" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <div class="noscript">Esta web necesita JavaScript para dibujar el plano. Puedes escribirme a <b>guillermogr13@yahoo.es</b>.</div>
</noscript>
<!--APP-END-->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
